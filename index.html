<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miss Emily 課程介紹</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1E3A8A;
            --primary-light: #EFF6FF;
            --accent: #D97706;
            --accent-bg: #FEF3C7;
            --text-main: #1F2937;
            --text-muted: #4B5563;
            --bg-main: #F8FAFC;
            --card-bg: #FFFFFF;
            --border-color: #E2E8F0;
            --shadow-sm: 0 2px 5px rgba(0,0,0,0.04);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif; 
            line-height: 1.6; 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            font-size: 35px; 
        }

        header { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px); 
            border-bottom: 2px solid var(--border-color);
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            padding: 20px 40px;
            box-shadow: var(--shadow-sm);
        }

        .top-title { 
            font-size: 50px; 
            font-weight: 900; 
            color: var(--primary);
            letter-spacing: -1px;
        }

        .container { 
            max-width: 1200px; 
            margin: 40px auto; 
            padding: 0 24px; 
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 40px;
        }

        /* 側邊導覽列 */
        .sidebar {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 30px;
            border: 2px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            height: fit-content;
            position: sticky;
            top: 120px;
        }

        .sidebar h3 {
            font-size: 38px;
            color: var(--primary);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid var(--primary-light);
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar li {
            margin-bottom: 15px;
        }

        .sidebar a {
            display: block;
            padding: 15px 20px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 32px;
            font-weight: 700;
            border-radius: 12px;
            background: var(--bg-main);
            border: 2px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .sidebar a:hover, .sidebar a.active {
            background: var(--primary-light);
            color: var(--primary);
            border-color: #DBEAFE;
            transform: translateX(5px);
        }

        /* 主內容區 */
        .main-content {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 40px;
            border: 2px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .main-content h1 {
            color: var(--primary);
            font-size: 45px;
            font-weight: 900;
            margin-bottom: 24px;
        }

        .main-content p {
            font-size: 35px;
            margin-bottom: 20px;
            color: var(--text-muted);
        }

        footer { 
            text-align: center; 
            padding: 40px; 
            color: var(--text-muted); 
            font-size: 35px; 
            margin-top: 50px; 
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="top-title">Miss Emily 課程介紹</div>
    </header>

    <div class="container">
        <!-- 側邊選單 -->
        <aside class="sidebar">
            <h3>課程導覽</h3>
            <ul>
                <li><a href="abacus.html">兒童珠心算及數學課程</a></li>
                <li><a href="finger-math.html">兒童手指速算及數學課程</a></li>
                <li><a href="abacus-benefits.html">💡 學珠心算的好處</a></li>
            </ul>
        </aside>

        <!-- 主頁歡迎內容 -->
        <main class="main-content">
            <h1>歡迎來到 Miss Emily 課程專頁</h1>
            <p>我們致力於為 K2 至小一的兒童提供最優質的數學思維與心算啟蒙教育。</p>
            <p>請從左側選單選擇您想了解的課程內容或專題文章，為孩子的數學根基打好基礎！</p>
        </main>
    </div>

    <footer>
        <p>&copy; Miss Emily Teaching Studio. All Rights Reserved.</p>
    </footer>

</body>
</html>
