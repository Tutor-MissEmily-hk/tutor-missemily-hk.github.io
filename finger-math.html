<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兒童手指速算及數學課程 - Miss Emily</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1E3A8A;
            --primary-light: #EFF6FF;
            --text-main: #1F2937;
            --text-muted: #4B5563;
            --bg-main: #F8FAFC;
            --card-bg: #FFFFFF;
            --border-color: #E2E8F0;
            --shadow-sm: 0 2px 5px rgba(0,0,0,0.04);
            --radius: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans TC', sans-serif; line-height: 1.6; background-color: var(--bg-main); color: var(--text-main); font-size: 35px; }
        header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 2px solid var(--border-color); position: sticky; top: 0; z-index: 1000; padding: 20px 30px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow-sm); }
        .back-btn { background: var(--primary-light); color: var(--primary); border: 2px solid #DBEAFE; padding: 16px 28px; border-radius: 40px; text-decoration: none; font-size: 35px; font-weight: 700; display: inline-flex; align-items: center; gap: 10px; transition: all 0.2s ease; }
        .back-btn:hover { background: var(--primary); color: #ffffff; }
        .top-title { font-size: 50px; font-weight: 900; color: var(--primary); letter-spacing: -1px; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 24px; }
        .card { background: var(--card-bg); border-radius: var(--radius); padding: 40px; margin-bottom: 36px; border: 2px solid var(--border-color); box-shadow: var(--shadow-sm); border-left: 10px solid var(--primary); }
        .card h2 { color: var(--primary); font-size: 45px; font-weight: 800; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 4px solid var(--primary-light); }
        .card p { font-size: 35px; margin-bottom: 20px; }
        footer { text-align: center; padding: 40px; color: var(--text-muted); font-size: 35px; margin-top: 50px; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back-btn">← 返回主頁</a>
        <div class="top-title">課程詳情</div>
    </header>
    <div class="container">
        <section class="card">
            <h2>🖐️ 兒童手指速算及數學課程</h2>
            <p>透過手腦並用方式提高靈敏度，啟發邏輯思維與快速計算能力。</p>
            <p>適合較年幼或剛接觸數學的小朋友，用最直觀的手指動作輔助運算，令抽象的數字概念變得生動易明，輕鬆跨越數學的第一道門檻。</p>
        </section>
    </div>
    <footer>
        <p>&copy; Miss Emily Teaching Studio. All Rights Reserved.</p>
    </footer>
</body>
</html>
